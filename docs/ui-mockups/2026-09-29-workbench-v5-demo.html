<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>统一消息中心 · 可进入演示（v5）</title>
<style>
/* ============ 统一消息中心 · 可进入 Demo（v5） ============
   视觉语言承接 v4：深色 chrome（顶栏 + 左栏）+ 浅色内容区。
   本文件在 v4 tokens 之上补齐「可导航应用」需要的新组件。 */

:root{
  /* ---- 深色 chrome ---- */
  --chrome:#141a22;
  --chrome-2:#11161c;
  --c-ink:#ffffff;
  --c-ink2:rgba(255,255,255,.72);
  --c-ink3:rgba(255,255,255,.54);
  --c-ink4:rgba(255,255,255,.42);
  --c-line:rgba(255,255,255,.075);
  --c-hover:rgba(255,255,255,.055);
  --c-on:rgba(255,255,255,.10);
  --c-field:rgba(255,255,255,.07);

  /* ---- 浅色内容区 ---- */
  --canvas:#f1f2f4;
  --surface:#ffffff;
  --ink:#0f1419;
  --ink2:#5b6675;
  --ink3:#98a1ad;
  --hair:#eceef1;
  --hair2:#e2e5e9;
  --btn:#14181f;

  --red:#d92d20;   --red-soft:#fef3f2;
  --amber:#b54708; --amber-soft:#fdf3e5;
  --green:#1a7a50; --green-soft:#e8f5ee;

  --wa:#22a06b;    --wa-soft:#e8f5ee;
  --mail:#2f7ae5;  --mail-soft:#eaf1fd;
  --wecom:#5b5bd6; --wecom-soft:#eeeefb;
  --phone:#d1851c; --phone-soft:#fdf3e4;

  --d-wa:#4ee0a3;
  --d-mail:#84b1ff;
  --d-wecom:#aaaaff;
  --d-phone:#ffbb66;

  --r-panel:16px;
  --r-md:10px;
  --r-sm:8px;
  --sh-panel:0 1px 2px rgba(16,24,40,.04), 0 8px 22px -14px rgba(16,24,40,.16);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--canvas);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:13.5px;line-height:1.5;font-variant-numeric:tabular-nums;
  overflow:hidden;
}
button{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
/* 图标默认尺寸：ic() 产出的都是 24×24 viewBox 图标。
   原来只给 svg 设了 display:block、尺寸靠在各个容器上用后代选择器补 ——
   漏掉的上下文（如接口详情空态 .dt）会让 svg 撑满容器，渲染出两个巨大的 < > 箭头。 */
svg{width:16px;height:16px;flex:none}
.app{height:100vh;display:flex;flex-direction:column;background:var(--chrome)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ==================== 顶栏 ==================== */
.top{
  height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--chrome);color:var(--c-ink);position:relative;z-index:60;
}
.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:640;letter-spacing:-.012em;flex:none}
.brand .mark{
  width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.12);
}
.brand .mark svg{width:13px;height:13px;color:#fff}

.nav{display:flex;align-items:center;gap:2px;height:56px;flex:none}
.nav a{
  position:relative;display:flex;align-items:center;height:56px;padding:0 10px;
  color:var(--c-ink2);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;
}
.nav a:hover{color:#fff}
.nav a.on{color:#fff;font-weight:620}
.nav a.on::after{
  content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;
  border-radius:2px 2px 0 0;background:#fff;
}
.nav a .dot{width:5px;height:5px;border-radius:50%;background:#ff6b5e;margin-left:5px;position:relative;top:-5px;flex:none}
.spacer{flex:1;min-width:4px}

.search{
  display:flex;align-items:center;gap:8px;width:200px;height:34px;padding:0 10px;
  border-radius:var(--r-md);background:var(--c-field);color:var(--c-ink3);flex:none;
}
.search svg{width:14px;height:14px;flex:none}
.search input{
  flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:13px;outline:none;
}
.search input::placeholder{color:var(--c-ink3)}

.tbtn{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;flex:none;
  border:0;border-radius:var(--r-md);background:transparent;color:var(--c-ink2);cursor:pointer;
  font-size:12.5px;font-weight:550;white-space:nowrap;
}
.tbtn:hover{background:var(--c-hover);color:#fff}
.tbtn.on{background:rgba(255,255,255,.14);color:#fff}
.tbtn svg{width:15px;height:15px;flex:none}
.tbtn .nb{
  min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:grid;place-items:center;
  background:rgba(255,255,255,.16);color:#fff;font-size:11px;font-weight:650;
}
.tbtn .nb.hot{background:#e5484d}

.icon-btn{
  width:34px;height:34px;flex:none;display:grid;place-items:center;
  border:0;border-radius:var(--r-md);background:transparent;color:var(--c-ink2);cursor:pointer;
}
.icon-btn:hover{background:var(--c-hover);color:#fff}
.icon-btn svg{width:16px;height:16px}
.who{
  display:flex;align-items:center;gap:9px;margin-left:2px;padding-left:13px;
  border-left:1px solid var(--c-line);flex:none;
}
.who .av{
  width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.13);color:#fff;font-size:12px;font-weight:650;
}
.who b{font-size:12.5px;font-weight:600;display:block;line-height:1.25;color:#fff}
.who small{display:block;font-size:11px;color:var(--c-ink3);font-weight:400;line-height:1.25}

/* 「更多」飞出菜单 */
.more-wrap{position:relative;height:56px;display:flex;align-items:center}
.flyout{
  position:absolute;top:52px;left:0;min-width:216px;padding:6px;z-index:80;
  background:#1b232d;border:1px solid rgba(255,255,255,.09);border-radius:12px;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.6);display:none;
}
.flyout.open{display:block}
.flyout .fl-t{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--c-ink4);padding:8px 10px 4px;
}
.flyout a{
  display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:7px;
  color:var(--c-ink2);text-decoration:none;font-size:12.5px;font-weight:500;cursor:pointer;
}
.flyout a:hover{background:var(--c-hover);color:#fff}
.flyout a.on{background:var(--c-on);color:#fff;font-weight:620}
.flyout a svg{width:14px;height:14px;flex:none}
.flyout hr{border:0;border-top:1px solid var(--c-line);margin:5px 8px}

/* ==================== 主体 ==================== */
.body{flex:1;min-height:0;display:flex;background:var(--chrome)}

/* ---------- 左栏（深色） ---------- */
.rail{
  width:284px;flex:none;display:flex;flex-direction:column;min-height:0;
  background:var(--chrome-2);position:relative;z-index:40;
}
.rail-hd{flex:none;padding:12px 12px 8px}
.rsearch{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;
  border-radius:var(--r-sm);background:var(--c-field);color:var(--c-ink3);font-size:12.5px;
}
.rsearch svg{width:13px;height:13px;flex:none}
.rsearch input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:12.5px;outline:none}
.rsearch input::placeholder{color:var(--c-ink3)}

.back{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;margin-bottom:2px;
  border-radius:7px;color:var(--c-ink2);font-size:12.5px;font-weight:550;cursor:pointer;
}
.back:hover{background:var(--c-hover);color:#fff}
.back svg{width:14px;height:14px}

.sec{flex:none;padding:4px 8px 8px;overflow:auto;max-height:52%}
.sec::-webkit-scrollbar{width:8px}
.sec::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.sec-t{
  font-size:10.5px;font-weight:600;letter-spacing:.08em;
  color:var(--c-ink4);padding:6px 9px 4px;
}
.frow{
  position:relative;display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;
  border-radius:7px;font-size:12.5px;color:var(--c-ink2);cursor:pointer;font-weight:500;
}
.frow i{width:6px;height:6px;border-radius:2px;flex:none;display:block}
.frow .n{margin-left:auto;font-size:11px;font-weight:600;color:var(--c-ink4)}
.frow:hover{background:var(--c-hover);color:#fff}
.frow.on{background:var(--c-on);color:#fff;font-weight:620}
.frow.on .n{color:var(--c-ink2)}
.frow.on::before{
  content:"";position:absolute;left:0;top:7px;bottom:7px;width:2.5px;
  border-radius:0 3px 3px 0;background:#fff;
}

.rlist{
  flex:1;min-height:0;overflow:auto;padding:8px;
  border-top:1px solid var(--c-line);
}
.rlist::-webkit-scrollbar{width:8px}
.rlist::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px;border:2px solid transparent;background-clip:padding-box}

/* ---------- 会话行 ---------- */
.item{
  position:relative;display:flex;gap:11px;padding:8px 10px;border-radius:var(--r-md);
  cursor:pointer;margin-bottom:1px;
}
.item:hover{background:var(--c-hover)}
.item.on{background:var(--c-on)}
.item.on::before{
  content:"";position:absolute;left:0;top:10px;bottom:10px;width:2.5px;
  border-radius:0 3px 3px 0;background:#fff;
}
.av{
  position:relative;width:36px;height:36px;border-radius:10px;flex:none;
  display:grid;place-items:center;font-size:13px;font-weight:650;letter-spacing:.02em;
}
.av.t1{background:rgba(47,122,229,.24);color:#9ec5ff}
.av.t2{background:rgba(34,160,107,.24);color:#84e3b5}
.av.t3{background:rgba(91,91,214,.30);color:#b6b6ff}
.av.t4{background:rgba(209,133,28,.24);color:#ffca85}
.av.t5{background:rgba(217,45,32,.24);color:#ffa39b}
.av.t6{background:rgba(31,111,133,.30);color:#95dcec}
.av.t7{background:rgba(255,255,255,.11);color:#cdd3da}
.av .ch{
  position:absolute;width:11px;height:11px;border-radius:50%;
  border:2.5px solid var(--chrome-2);
}
.av .ch.a{right:-3px;bottom:-3px}
.av .ch.b{right:-3px;top:-3px;bottom:auto}
.dotwa{background:var(--d-wa)}.dotmail{background:var(--d-mail)}
.dotwecom{background:var(--d-wecom)}.dotphone{background:var(--d-phone)}

.it-b{min-width:0;flex:1;display:flex;gap:8px;align-items:flex-start}
.it-mid{min-width:0;flex:1}
.it-t{
  display:block;font-size:13px;font-weight:520;letter-spacing:-.005em;color:var(--c-ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.it-p{
  font-size:12px;color:var(--c-ink4);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.it-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:1px}
.it-r time{font-size:11px;color:var(--c-ink4);white-space:nowrap}
.pill-n{
  min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center;
  border-radius:999px;background:#e5484d;color:#fff;font-size:11.5px;font-weight:700;
}

/* ---------- 内容区（浅色） ---------- */
.content{
  flex:1;min-width:0;min-height:0;overflow:auto;background:var(--canvas);
  padding:18px 22px 20px;display:flex;flex-direction:column;gap:16px;
}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:#dcdfe4;border-radius:8px;border:2px solid var(--canvas)}
.content.flush{padding:0;gap:0;overflow:hidden;display:flex}
.panel{background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--sh-panel)}
.panel.tight{border-radius:0;box-shadow:none;border-right:1px solid var(--hair)}

.crumbs{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink3);padding:0 2px}
.crumbs a{color:var(--ink2);text-decoration:none;font-weight:550;cursor:pointer}
.crumbs a:hover{color:var(--ink)}
.crumbs svg{width:12px;height:12px}
.crumbs code{font:500 11.5px/1.4 var(--mono);background:#e9ebee;padding:2px 6px;border-radius:5px;color:var(--ink2)}

.greet{display:flex;align-items:flex-end;gap:16px;padding:2px 2px 0}
.greet h1{margin:0;font-size:21px;font-weight:660;letter-spacing:-.028em;line-height:1.2}
.greet p{margin:7px 0 0;font-size:13px;color:var(--ink2)}
.greet p b{color:var(--red);font-weight:650}
.greet .act{margin-left:auto;display:flex;gap:8px;padding-bottom:1px;flex:none}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-md);
  border:1px solid var(--hair2);background:#fff;color:var(--ink);font-size:13px;font-weight:550;cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:#fafbfc}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff;box-shadow:0 3px 10px -4px rgba(15,20,25,.55)}
.btn.pri:hover{background:#242a33;border-color:#242a33}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:17px 4px}
.stat{position:relative;padding:0 20px;min-width:0}
.stat:first-child{padding-left:22px}
.stat + .stat::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--hair);
}
.stat .lab{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);font-weight:530}
.stat .lab i{width:6px;height:6px;border-radius:2px;flex:none;display:block}
.stat .v{margin-top:10px;display:flex;align-items:baseline;gap:8px}
.stat .v b{font-size:31px;font-weight:650;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.stat .v em{
  font-style:normal;font-size:11.5px;font-weight:600;padding:2.5px 7px;border-radius:6px;
  background:#f4f5f7;color:var(--ink2);position:relative;top:-4px;
}
.stat .v em.good{background:var(--wa-soft);color:var(--green)}
.stat .v .chs{align-self:center;display:inline-flex;align-items:center;gap:4px}
.stat .v .chs i{width:7px;height:7px;border-radius:2px;display:block}
.stat.alert .v b{color:var(--red)}

.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

.hd{display:flex;align-items:center;gap:8px;padding:15px 20px 12px}
.hd h2{margin:0;font-size:14px;font-weight:640;letter-spacing:-.012em}
.hd h2 span{font-weight:400;color:var(--ink3);font-size:12.5px;letter-spacing:0}
.hd .cnt{
  min-width:19px;height:19px;padding:0 6px;display:grid;place-items:center;border-radius:6px;
  background:#f4f5f7;color:var(--ink2);font-size:11px;font-weight:700;
}
.hd .cnt.hot{background:var(--red-soft);color:var(--red)}
.hd .more{
  margin-left:auto;font-size:12.5px;color:var(--ink2);font-weight:550;text-decoration:none;
  display:inline-flex;align-items:center;gap:2px;cursor:pointer;
}
.hd .more:hover{color:var(--ink)}
.hd .more svg{width:13px;height:13px}

.need-wrap{display:flex;flex-direction:column;padding:0 8px 8px}
.need{position:relative;display:flex;gap:11px;padding:15px 12px;border-radius:var(--r-md);cursor:pointer}
.need + .need::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--hair)}
.need:hover{background:#fafbfc}
.need .av{width:34px;height:34px;border-radius:9px;font-size:12.5px}
.need .av.t1{background:#e9f0fb;color:#2b5fa8}
.need .av.t3{background:#efeffc;color:#4b4bc0}
.need .av.t5{background:#fbeceb;color:#b13a34}
.need .av.t2{background:#e8f5ee;color:#1a7a50}
.need .av.t4{background:#fdf3e4;color:#a26714}
.need .b{flex:1;min-width:0}
.need .t{display:flex;align-items:baseline;gap:8px}
.need .t b{font-size:13.5px;font-weight:620;letter-spacing:-.008em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .t time{margin-left:auto;font-size:11px;color:var(--ink3);flex:none}
.need .q{
  margin-top:9px;padding:10px 12px;border-radius:var(--r-sm);background:#f7f8fa;
  font-size:12.5px;color:var(--ink2);line-height:1.58;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.need .m{display:flex;align-items:center;gap:7px;margin-top:10px}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap}
.chi{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:6px;flex:none}
.chi svg{width:12.5px;height:12.5px}
.chi.t-mail{background:var(--mail-soft);color:var(--mail)}
.chi.t-wecom{background:var(--wecom-soft);color:var(--wecom)}
.chi.t-phone{background:var(--phone-soft);color:var(--phone)}
.chi.t-chatapp{background:var(--wa-soft);color:var(--wa)}
.tag.w8{background:var(--red-soft);color:#b42318;font-weight:650}
.tag.w4{background:var(--amber-soft);color:var(--amber);font-weight:650}
.tag.gray{background:#f4f5f7;color:var(--ink2)}
.tag.good{background:var(--wa-soft);color:var(--green)}
.need .mini{
  margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;
  border-radius:7px;background:var(--btn);color:#fff;font-size:12px;font-weight:600;border:0;cursor:pointer;
}
.need .mini:hover{background:#242a33}
.need .mini.ghost{background:#fff;color:var(--ink);border:1px solid var(--hair2)}
.need .mini.ghost:hover{background:#f7f8fa}
.need .mini svg{width:12px;height:12px}

.todo{display:flex;flex-direction:column;padding:0 8px 12px}
.td{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-sm);cursor:pointer;align-items:center}
.td:hover{background:#fafbfc}
.td .box{width:16px;height:16px;border-radius:5px;border:1.5px solid #cfd4db;flex:none;display:grid;place-items:center}
.td .box svg{width:10px;height:10px;color:#fff;opacity:0}
.td.done .box{background:var(--btn);border-color:var(--btn)}
.td.done .box svg{opacity:1}
.td.done .txt{color:var(--ink3);text-decoration:line-through;text-decoration-color:#c9ced6}
.td .txt{font-size:12.5px;color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td .due{margin-left:auto;flex:none;font-size:11px;font-weight:600;color:var(--ink3)}
.td .due.hot{color:var(--red)}
.td .due.warm{color:var(--amber)}

.chan{padding:2px 20px 20px}
.stackbar{display:flex;height:9px;border-radius:999px;overflow:hidden;background:#f1f2f4;gap:2px}
.stackbar i{display:block;height:100%}
.lgds{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:14px}
.lgd{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2)}
.lgd i{width:6px;height:6px;border-radius:2px;display:block;flex:none}
.lgd b{font-weight:650;color:var(--ink);letter-spacing:-.01em}

/* ==================== 会话详情（可进入） ==================== */
.thread{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface)}
.th-hd{
  flex:none;display:flex;align-items:center;gap:11px;padding:11px 18px;
  border-bottom:1px solid var(--hair);
}
.th-hd .av{width:34px;height:34px;border-radius:9px}
.th-hd .nm{font-size:14px;font-weight:640;letter-spacing:-.012em}
.th-hd .sub{font-size:11.5px;color:var(--ink3);margin-top:2px;display:flex;align-items:center;gap:6px}

/* ---------- 事件 ---------- */
function bind() {
  var app = document.getElementById('app');
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); go(g.getAttribute('data-go')); return; }
    var a = e.target.closest('[data-act]');
    if (!a) {
      if (S.moreOpen && !e.target.closest('.more-wrap')) { S.moreOpen = false; paintTop(); }
      return;
    }
    var act = a.getAttribute('data-act'), v = a.getAttribute('data-v');
    handle(act, v, a);
  });
  window.addEventListener('popstate', function () { S.hash = location.hash || '#/'; render(); });
  window.addEventListener('hashchange', function () { if (S.hash !== location.hash) { S.hash = location.hash || '#/'; render(); } });
  window.addEventListener('resize', function () {
    if (window.innerWidth > 1080 && S.railOpen) { S.railOpen = false; paintTop(); paintContent(); }
  });
}

function handle(act, v, el) {
  switch (act) {
    case 'rail': S.railOpen = !S.railOpen; syncRail(); break;
    case 'more': S.moreOpen = !S.moreOpen; paintShell(); break;
    case 'api': S.apiOpen = !S.apiOpen; paintShell(); break;
    case 'log': S.logOpen = !S.logOpen; paintShell(); break;
    case 'railf': S.railFilter = v; paintRail(); break;
    case 'addrch': S.addrCh = v; paintRail(); break;
    case 'apid': S.apiD = v; paintRail(); paintApi(); break;
    case 'apitab': S.apiTab = v; paintRail(); if (S.page !== 'api') go('#/api'); else paintApi(); break;
    case 'apiq':
      S.apiQ = el.value; paintApi(); break;
    case 'apim': S.apiM = v; paintApi(); break;
    case 'cmpch': S.composeCh = v; paintContent(); break;
    case 'msg': S.selMsg = (S.selMsg === v ? null : v); paintContent(); break;
    case 'call': openCall(v); break;
    case 'todo': toggleTodo(v); break;
    case 'reload': toast('已重新拉取会话（演示：又记了几条请求）'); call('fetchThread', { contactId: v }, '会话工作区 · 手动刷新'); call('fetchContact', { id: v }, '会话工作区 · 手动刷新'); break;
    case 'tabs': toast('真实应用里这是「混合时间线 / 企微会话」切换，会换掉整个时间线组件'); break;
    case 'sendsim': simulateSend(v); break;
    case 'pick': pickEndpoint(v); break;
    case 'route': go('#/conversations/contact/c1'); break;
  }
}

function msgBub(m) {
  var isOut = m.dir === 'out', sel = S.selMsg === m.id;
  var atts = (m.atts || []).map(function (a) {
    return '<div class="att">' + ic(a.kind === 'image' ? 'img' : 'doc') + esc(a.name) + ' · ' + esc(a.size) + '</div>';

/* ============ Part 3：接口目录页 / 右侧接口抽屉 / 底部请求日志 / 启动 ============ */
(function () {
'use strict';
var A = window.MCAPP, S = A.S, esc = A.esc, ic = A.ic, call = A.call, ms = A.ms, go = A.go, toast = A.toast;
var EPS = A.EPS, DOMAINS = A.DOMAINS, ROUTES = A.ROUTES, BY_NAME = A.BY_NAME;
var LOG = A.LOG;

/* ================= 摘要条 ================= */
function summary() {
  var byM = {};
  EPS.forEach(function (e) { byM[e.method] = (byM[e.method] || 0) + 1; });
  var reads = EPS.filter(function (e) { return e.read; }).length;
  var noUse = EPS.filter(function (e) { return !(e.usedBy || []).length; }).length;
  var real = ROUTES.filter(function (r) { return !r.demo; }).length;
  return '<section class="panel"><div class="cat-sum">' +
    cell(EPS.length, '前端接口总数', '来自 endpoints.ts 的 196 个导出函数 · 197 条调用路径') +
    cell(real, '前端路由', '来自 router.tsx（含 1 条旧链接重定向）') +
    cell(reads + ' / ' + (EPS.length - reads), '只读 / 写', '只读免确认，写操作要确认卡片') +
    cell(DOMAINS.length, '接口域', '按路径前缀归并') +
    cell(noUse, '未被页面引用', '有定义但当前没有 UI 入口') +
    '</div></section>';
}
function cell(n, t, d) {
  return '<div class="stat"><div class="lab">' + t + '</div><div class="v"><b>' + n + '</b></div>' +
    '<div style="font-size:11px;color:var(--ink3);margin-top:6px">' + d + '</div></div>';
}

/* ================= 过滤 ================= */
function filtered() {
  var q = S.apiQ.trim().toLowerCase();
  return EPS.filter(function (e) {
    if (S.apiM !== 'ALL' && e.method !== S.apiM) return false;
    if (S.apiD !== 'ALL' && e.domain !== S.apiD) return false;
    if (!q) return true;
    return (e.name + ' ' + e.path + ' ' + (e.label || '') + ' ' + e.domain + ' ' + (e.usedBy || []).join(' ')).toLowerCase().indexOf(q) >= 0;
  });
}

/* ================= 接口目录页 ================= */
A.paintApi = function () {
  if (S.page !== 'api') return;
  var el = document.getElementById('content');
  if (!el) return;
  el.className = 'content';

  var methods = ['ALL', 'GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'SSE'];
  var tab = S.apiTab || 'catalog';
  el.innerHTML =
    '<div class="cat">' +
      '<div class="crumbs"><span>统一消息中心</span>' + ic('chev') + '<code>#/api</code>' +
        '<span style="margin-left:auto">这一页不在真实路由里 —— 是把 <code>frontend/src/api/endpoints.ts</code> 的导出面直接摊开</span></div>' +
      '<div class="pghd"><div><h1>接口目录</h1>' +
        '<p>共 <b>' + EPS.length + '</b> 个前端接口函数，全部由源码解析得出；点任意一行看详情，点「试调用」会真的发一次（记进底部请求日志）。</p></div>' +
        '<div class="act">' +
          '<span class="seg"><button class="' + (tab === 'catalog' ? 'on' : '') + '" data-act="apitab" data-v="catalog">接口目录</button>' +
          '<button class="' + (tab === 'routes' ? 'on' : '') + '" data-act="apitab" data-v="routes">前端路由表</button></span>' +
          '<button class="btn" data-act="log">' + ic('bolt') + '请求日志 ' + LOG.length + '</button>' +
        '</div></div>' +
      summary() +
      (tab === 'routes' ? routesTable() :
        '<section class="panel"><div class="cat-tool">' +
          '<label class="inp">' + ic('search') + '<input data-in="apiq" placeholder="搜函数名 / 路径 / 中文名 / 使用方文件" value="' + esc(S.apiQ) + '"></label>' +
          '<span class="chips-f">' + methods.map(function (m) {
            var n = m === 'ALL' ? EPS.length : EPS.filter(function (e) { return e.method === m; }).length;
            return '<button class="cf ' + (S.apiM === m ? 'on' : '') + '" data-act="apim" data-v="' + m + '">' + m + ' <span style="opacity:.6">' + n + '</span></button>';
          }).join('') + '</span>' +
          (S.apiD !== 'ALL' ? '<button class="cf on" data-act="apid" data-v="ALL">域：' + esc(S.apiD) + ' ×</button>' : '') +
          '<span style="margin-left:auto;font-size:11.5px;color:var(--ink3)">命中 <b id="hitn">' + filtered().length + '</b> / ' + EPS.length + '</span>' +
        '</div>' +
        '<div class="cat-body" style="padding:0 16px 16px">' +
          '<div class="cat-grp" id="apilist"></div>' +
          '<div class="panel cat-det" id="apidet">' + detail() + '</div>' +
        '</div></section>') +
    '</div>';
  paintApiList();
};

function routesTable() {
  return '<section class="panel"><div class="ghd"><h2>前端路由表</h2><span class="n">' + ROUTES.length + '</span>' +
    '<span class="sp"><span>复刻 <code style="font-family:var(--mono)">frontend/src/router.tsx</code> · 点路径可直接跳过去</span></span></div>' +
    '<table class="tbl"><thead><tr><th>路径</th><th>路由 key</th><th>渲染组件</th><th>说明</th><th class="r">跳转</th></tr></thead><tbody>' +
    ROUTES.map(function (r) {
      var h = r.key === 'thread' ? '#/conversations/contact/c1'
        : r.key === 'wecomGroup' ? '#/conversations/wecom-group/g1'
        : r.key === 'addrbook' ? '#/address-book/email'
        : r.key === 'legacy' ? '#/thread/c1' : r.path.replace(/^\/+/, '#/').replace(/:contactId/, 'c1').replace(/:sourceConversationId/, 'g1').replace(/:channel/, 'email');
      if (r.key === 'dashboard') h = '#/';
      return '<tr' + (r.demo ? '' : '') + '><td class="mono">' + esc(r.path) + (r.demo ? ' <span class="tag gray" style="font-family:inherit">demo 补</span>' : '') + '</td>' +
        '<td class="mono">' + esc(r.key) + '</td>' +
        '<td style="font-size:11.5px;color:var(--ink2)">' + esc(r.comp) + '</td>' +
        '<td>' + esc(r.name) + '</td>' +
        '<td class="r"><button class="btn sm" data-go="' + h + '">打开</button></td></tr>';
    }).join('') + '</tbody></table></section>';
}

function paintApiList() {
  var box = document.getElementById('apilist');
  if (!box) return;
  var rows = filtered();
  var hn = document.getElementById('hitn');
  if (hn) hn.textContent = rows.length;
  if (!rows.length) { box.innerHTML = '<div style="padding:30px;text-align:center;color:var(--ink3)">没有命中的接口</div>'; return; }
  var byDomain = {};
  rows.forEach(function (r) { (byDomain[r.domain] = byDomain[r.domain] || []).push(r); });
  box.innerHTML = DOMAINS.filter(function (d) { return byDomain[d]; }).map(function (d) {
    var list = byDomain[d];
    return '<section class="panel"><div class="ghd"><h2>' + esc(d) + '</h2><span class="n">' + list.length + '</span>' +
      '<span class="sp"><span>' + list.filter(function (e) { return e.read; }).length + ' 只读 / ' + list.filter(function (e) { return !e.read; }).length + ' 写</span></span></div>' +
      list.map(function (e) {
        return '<div class="rowx ' + (S.picked === e.name ? 'on' : '') + '" data-act="pick" data-v="' + esc(e.name) + '">' +
          '<span class="mb ' + e.method + '">' + e.method + '</span>' +
          '<span class="nx"><span class="nm">' + esc(e.label || e.name) + ' <em>' + esc(e.name) + '</em></span>' +
          '<div class="pt">' + esc(e.path) + '</div></span>' +
          '<span class="fn">' + ((e.usedBy || [])[0] ? esc(String(e.usedBy[0]).split('/').pop()) : (e.read ? '只读工具' : '—')) + '</span>' +
          '<span class="ar">' + ic('chev') + '</span></div>';
      }).join('') + '</section>';
  }).join('');
}

function detail() {
  var name = S.picked;
  var e = name ? BY_NAME[name] : null;
  if (!e) {
    return '<div class="dt">' + ic('code') + '<span class="dn">选一个接口看详情</span></div>' +
      '<div style="font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:8px">' +
      '左列任何一个接口都可以点开。详情里有：<br>' +
      '· 完整 URL（含 <code style="font-family:var(--mono)">/api</code> 前缀）<br>' +
      '· 前端函数名与签名<br>' +
      '· 请求体 / 响应类型<br>' +
      '· <b>哪些页面在用</b>（从真实 import 关系反查）<br>' +
      '· 可直接复制走的 curl<br>' +
      '· 「试调用」按钮 —— 会真的走一次 API 层并落到请求日志</div>';
  }
  var last = LOG.filter(function (l) { return l.name === e.name; })[0];
  var body = null;
  try { body = JSON.stringify(A.fixture(e.name, null), null, 2); } catch (err) { body = String(err); }
  if (body && body.length > 1300) body = body.slice(0, 1300) + '\n…（截断）';
  var curl = "curl -X " + e.method + " 'https://msg.center.local/api" + e.path + "' \\\n" +
    "  -H 'Authorization: Bearer <token>'" +
    (e.method === 'POST' || e.method === 'PUT' || e.method === 'PATCH' ? " \\\n  -H 'Content-Type: application/json'" : '');
  return '<div class="dt"><span class="mb ' + e.method + '">' + e.method + '</span>' +
    '<span class="dn">' + esc(e.label || e.name) + '</span></div>' +
    '<div style="font-size:11.5px;color:var(--ink3);margin-top:4px">' +
    esc(e.domain) + ' · ' + (e.read ? '只读（免确认）' : '写操作（要确认卡片）') + (e.usedBy && e.usedBy.length ? '' : ' · 当前没有页面引用') + '</div>' +
    '<div class="dp"><span class="api">/api</span>' + esc(e.path) + '</div>' +
    '<div class="sec-t2">前端函数 <span class="ln"></span></div>' +
    '<div class="code">' + esc(e.name) + '(' + (e.sig ? esc(e.sig.replace(/^(async )?function ' + e.name + '\s*\(/, '').replace(/\).*$/, '')) : '') + ')</div>' +
    '<div class="sec-t2">请求体 / 参数 <span class="ln"></span></div>' +
    '<div class="code">' + (e.body ? esc(e.body) : '（无 —— 参数都在路径或 query 里）') + '</div>' +
    '<div class="sec-t2">哪些页面在用 <span class="ln"></span></div>' +
    ((e.usedBy && e.usedBy.length)
      ? '<ul class="ul">' + e.usedBy.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>'
      : '<div style="font-size:12px;color:var(--ink3)">没有任何非测试文件 import 它</div>') +
    '<div class="sec-t2">可直接复制 <span class="ln"></span></div>' +
    '<div class="code">' + esc(curl) + '</div>' +
    '<div class="sec-t2">响应预览 <span class="ln"></span></div>' +
    '<div class="code">' + esc(body) + '</div>' +
    '<div class="sec-t2">操作 <span class="ln"></span></div>' +
    '<div style="display:flex;gap:8px;align-items:center">' +
      '<button class="btn sm pri" data-act="pick" data-v="' + esc(e.name) + '">' + ic('bolt') + '试调用</button>' +
      '<button class="btn sm" data-act="log">' + ic('clock') + '打开请求日志</button>' +
    '</div>' +
    (last ? '<div style="font-size:11.5px;color:var(--green);margin-top:10px">本次会话已调用 ' +
      LOG.filter(function (l) { return l.name === e.name; }).length + ' 次 · 最后一次 ' + ms(last.cost) + ' · 触发点「' + esc(last.trigger) + '」</div>' : '');
}

/* ================= 右侧接口抽屉 ================= */
A.paintApiDrawer = function () {
  var w = document.getElementById('apiwrap');
  if (!w) return;
  var rows = filtered().slice(0, 60);
  var groups = {};
  rows.forEach(function (r) { (groups[r.domain] = groups[r.domain] || []).push(r); });
  w.innerHTML =
    '<aside class="dw ' + (S.apiOpen ? 'open' : '') + '" aria-hidden="' + (!S.apiOpen) + '">' +
      '<div class="dw-hd">' + ic('code') + '<h2>接口目录</h2><span class="n">' + EPS.length + '</span>' +
        '<button class="x" data-act="api" aria-label="关闭">' + ic('x') + '</button></div>' +
      '<div style="padding:9px 12px 0"><label class="inp" style="width:100%">' + ic('search') +
        '<input data-in="apiq" placeholder="搜函数名 / 路径 / 中文名" value="' + esc(S.apiQ) + '"></label>' +
        '<div class="chips-f" style="margin-top:8px">' + ['ALL', 'GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'SSE'].map(function (m) {
          var n = m === 'ALL' ? EPS.length : EPS.filter(function (e) { return e.method === m; }).length;
          return '<button class="cf ' + (S.apiM === m ? 'on' : '') + '" data-act="apim" data-v="' + m + '">' + m + ' <span style="opacity:.6">' + n + '</span></button>';
        }).join('') + '</div></div>' +
      '<div class="dw-body" id="apilist2">' +
        (rows.length ? DOMAINS.filter(function (d) { return groups[d]; }).map(function (d) {
          return '<div style="font-size:10.5px;font-weight:650;letter-spacing:.07em;color:var(--ink3);margin:11px 8px 4px">' +
            esc(d) + ' · ' + groups[d].length + '</div>' +
            groups[d].map(function (e) {
              return '<div class="logrow" data-act="pick" data-v="' + esc(e.name) + '" style="grid-template-columns:52px minmax(0,1fr) 22px">' +
                '<span class="mb ' + e.method + '">' + e.method + '</span>' +
                '<span style="min-width:0"><div class="lfn">' + esc(e.label || e.name) + '</div>' +
                '<div class="lp">' + esc(e.path) + '</div></span>' +
                '<span style="color:var(--ink3)">' + ic('chev') + '</span></div>';
            }).join('');
        }).join('') : '<div style="padding:24px;text-align:center;color:var(--ink3);font-size:12.5px">没有命中</div>') +
      '</div>' +
      '<div class="dw-ft">' + ic('bolt') + '点一行 = 试调用一次，日志进底部' +
        '<span class="sp"><button class="btn sm" data-go="#/api">在整页打开</button></span></div>' +
    '</aside>';
};

/* ================= 底部请求日志 ================= */
A.paintLogBar = function () {
  var w = document.getElementById('logwrap');
  if (!w) return;
  var last = LOG[0];
  w.innerHTML =
    '<div class="logbar ' + (S.logOpen ? 'open' : '') + '">' +
      '<div class="lb-hd" data-act="log">' + ic('bolt') + '<b>请求日志</b>' +
        '<span class="lg">' + LOG.length + '</span>' +
        (last ? '<span class="m">' + last.method + ' /api' + last.path + ' · ' + last.status + ' · ' + ms(last.cost) + '</span>' : '<span class="m">还没有请求</span>') +
        '<span class="sp"></span>' +
        '<button class="tbtn" id="simsse" style="height:24px;color:#c8d2dc;font-size:11.5px;padding:0 9px" ' +
          'onclick="event.stopPropagation();window.MCAPP.simulateInbound()">模拟 SSE 推送一条新消息</button>' +
        '<span class="m">点这里展开 / 收起</span>' + ic(S.logOpen ? 'down' : 'chev') + '</div>' +
      '<div class="lb-rows" id="logrows"></div>' +
    '</div>';
  A.paintLog();
};

A.paintLog = function () {
  var box = document.getElementById('logrows');
  if (!box) return;
  box.innerHTML = LOG.length ? LOG.map(function (l) {
    return '<div class="logrow" data-act="pick" data-v="' + esc(l.name) + '">' +
      '<span class="mb ' + l.method + '">' + l.method + '</span>' +
      '<span style="min-width:0"><div class="lfn">' + esc(l.label) + '</div>' +
      '<div class="lt"><code>' + esc(l.path) + '</code><span>·</span><span>' + esc(l.trigger) + '</span></div></span>' +
      '<span><span class="ls ok">' + l.status + '</span><div class="lz">' + ms(l.cost) + '</div></span></div>';
  }).join('') : '<div style="padding:22px;text-align:center;color:#8b98a5;font-size:12.5px">操作一下界面（切页 / 点会话 / 试调用），这里就会冒请求</div>';
  var hd = document.querySelector('.lb-hd .lg');
  if (hd) hd.textContent = LOG.length;
};

/* ================= 输入事件 ================= */
document.addEventListener('input', function (e) {
  var el = e.target.closest('[data-in]');
  if (!el) return;
  if (el.getAttribute('data-in') === 'apiq') {
    S.apiQ = el.value;
    if (S.page === 'api') { paintApiList(); A.paintApiDrawerKeepFocus(); } else A.paintApiDrawerKeepFocus();
  }
});
/* 抽屉里的搜索要重绘抽屉但不能抢走焦点 —— 只重绘列表那一块 */
A.paintApiDrawerKeepFocus = function () {
  var box = document.getElementById('apilist2');
  if (box) {
    var rows = filtered().slice(0, 60), groups = {};
    rows.forEach(function (r) { (groups[r.domain] = groups[r.domain] || []).push(r); });
    box.innerHTML = rows.length ? DOMAINS.filter(function (d) { return groups[d]; }).map(function (d) {
      return '<div style="font-size:10.5px;font-weight:650;letter-spacing:.07em;color:var(--ink3);margin:11px 8px 4px">' +
        esc(d) + ' · ' + groups[d].length + '</div>' +
        groups[d].map(function (e) {
          return '<div class="logrow" data-act="pick" data-v="' + esc(e.name) + '" style="grid-template-columns:52px minmax(0,1fr) 22px">' +
            '<span class="mb ' + e.method + '">' + e.method + '</span>' +
            '<span style="min-width:0"><div class="lfn">' + esc(e.label || e.name) + '</div>' +
            '<div class="lp">' + esc(e.path) + '</div></span>' +
            '<span style="color:var(--ink3)">' + ic('chev') + '</span></div>';
        }).join('');
    }).join('') : '<div style="padding:24px;text-align:center;color:var(--ink3);font-size:12.5px">没有命中</div>';
  } else {
    A.paintApiDrawer();
  }
};

/* ================= 模拟收到新消息 ================= */
A.simulateInbound = function () {
  var c = window.MC_CONTACTS.filter(function (x) { return x.id === 'c3'; })[0];
  var n = (window.MC_THREADS.c3 || []).length;
  window.MC_THREADS.c3.push({
    id: 'm3x' + n, dir: 'in', ch: 'chatapp', kind: 'text',
    at: '2026-09-29T10:31:00+08:00', status: 'received',
    from: 'David Miller', to: '我',
    body: 'Thanks — our customs broker confirmed the entry can be lodged once we get the arrival notice. Please send it as soon as ETA is firm.',
  });
  c.unreadCount += 1;
  c.lastText = 'Please send the arrival notice as soon as ETA is firm.';
  c.lastMessageAt = '2026-09-29T10:31:00+08:00';
  c.status = 'awaiting_me';
  call('fetchContacts', { page: 1, size: 20 }, 'SSE 事件 · 新消息落库后刷新列表');
  call('fetchThread', { contactId: 'c3' }, 'SSE 事件 · 刷新当前会话');
  A.paintRail();
  if (S.page === 'dashboard' || S.page === 'thread') A.paintContent();
  if (!S.logOpen) { S.logOpen = true; A.paintLogBar(); }
  toast('SSE 推送：David Miller 来了一条新消息（未读 4）');
};

/* ================= 启动 ================= */
function boot() {
  A.bind();
  /* 打开时的初始化请求 —— 对齐真实应用的启动链路 */
  call('fetchAccountProfile', null, '应用启动 · 拉当前账号');
  call('fetchAccountRoles', null, '应用启动 · 拉角色');
  call('fetchContacts', { page: 1, size: 20 }, 'AppLayout · 会话列表');
  call('fetchTodos', null, 'AppLayout · 待办角标');
  if (location.hash && location.hash !== '#/') S.hash = location.hash;
  A.render();
  A.bind2 && A.bind2();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
