name: 部署 Spring 消息中心

on:
  push:
    branches: [main]
    paths:
      - "demo/message-center-spring/**"
      - "deploy/**"
      - ".github/workflows/deploy-message-center.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: message-center-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ROOT: /opt/crm-logistics-message-center
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: demo/message-center-spring/backend/pom.xml

      - name: 测试后端
        working-directory: demo/message-center-spring/backend
        run: mvn -B test

      - name: 构建后端
        working-directory: demo/message-center-spring/backend
        run: mvn -B -Pproduction -DskipTests clean package

      - name: 验证生产 Jar 不得包含 application-dev.yml
        working-directory: demo/message-center-spring/backend
        run: |
          set -euo pipefail
          jar_entries="$(unzip -Z1 target/message-center-1.0.0-SNAPSHOT.jar)"
          if grep -Fxq 'BOOT-INF/classes/application-dev.yml' <<< "$jar_entries"; then
            echo '生产 Jar 包含 application-dev.yml，拒绝发布。' >&2
            exit 1
          fi

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo/message-center-spring/frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: demo/message-center-spring/frontend
        run: npm ci

      - name: 测试前端
        working-directory: demo/message-center-spring/frontend
        run: npm test

      - name: 构建前端
        working-directory: demo/message-center-spring/frontend
        run: npm run build

      - name: 整理发布包
        run: |
          set -euo pipefail
          install -d build/message-center
          install -m 0644 \
            demo/message-center-spring/backend/target/message-center-1.0.0-SNAPSHOT.jar \
            build/message-center/message-center.jar
          tar -C demo/message-center-spring/frontend/dist \
            -czf build/message-center/frontend.tar.gz .
          install -m 0755 deploy/deploy.sh build/message-center/deploy.sh
          install -m 0644 deploy/message-center.service \
            build/message-center/message-center.service

      - name: 上传并切换生产版本
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          : "${SSH_PRIVATE_KEY:?缺少 PROD_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?缺少 PROD_KNOWN_HOSTS}"
          : "${PROD_HOST:?缺少 PROD_HOST}"
          : "${PROD_PORT:?缺少 PROD_PORT}"
          : "${PROD_USER:?缺少 PROD_USER}"

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/message-center-deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/message-center-deploy" "$HOME/.ssh/known_hosts"

          release_id="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          staging_dir="${APP_ROOT}/incoming/${release_id}"
          remote="${PROD_USER}@${PROD_HOST}"
          ssh_options=(
            -i "$HOME/.ssh/message-center-deploy"
            -p "$PROD_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )

          cleanup_remote() {
            ssh "${ssh_options[@]}" "$remote" \
              "rm -rf -- '$staging_dir'" || true
          }

          ssh "${ssh_options[@]}" "$remote" \
            "install -d -m 0755 '$staging_dir'"
          if ! scp \
            -i "$HOME/.ssh/message-center-deploy" \
            -P "$PROD_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            build/message-center/message-center.jar \
            build/message-center/frontend.tar.gz \
            build/message-center/deploy.sh \
            build/message-center/message-center.service \
            "$remote:$staging_dir/"; then
            cleanup_remote
            exit 1
          fi
          if ! ssh "${ssh_options[@]}" "$remote" \
            "bash '$staging_dir/deploy.sh' '$release_id' '$staging_dir'"; then
            cleanup_remote
            exit 1
          fi
