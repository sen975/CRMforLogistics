<!doctype html><meta charset="utf-8"><body><pre id="out">pending</pre><script>
const files = ['%E4%BB%AA%E8%A1%A8%E7%9B%98.svg','%E5%8A%A0%E5%8F%B7.svg','%E5%B7%A6%E7%AE%AD%E5%A4%B4.svg'];
let pending = files.length;
const result = [];
for (const file of files) {
  const img = new Image();
  img.onload = () => { result.push({file, ok:true, w: img.naturalWidth, h: img.naturalHeight}); if (!--pending) out.textContent = JSON.stringify(result); };
  img.onerror = () => { result.push({file, ok:false}); if (!--pending) out.textContent = JSON.stringify(result); };
  img.src = '../customer/svg/' + file;
}
setTimeout(() => { if (pending) out.textContent = JSON.stringify({timeout:true, result}); }, 1500);
</script></body>
