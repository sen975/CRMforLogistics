server:
  port: 8099

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/message_center
    username: message_center
    password: ${postgres_password}
  flyway:
    enabled: true
    locations: classpath:db/migration

postgres_password: ${SPRING_DATASOURCE_PASSWORD:}

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: message-center

app:
  data-dir: data-local
  local-dev-mode: true

  chatapp:
    sync-enabled: true

  aliyun-access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  aliyun-access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  cams-region: ap-southeast-1
  cams-endpoint: cams.ap-southeast-1.aliyuncs.com
