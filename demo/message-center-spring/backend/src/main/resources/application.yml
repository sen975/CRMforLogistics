spring:
  application:
    name: message-center
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: ${CALL_RECORD_MULTIPART_MAX_REQUEST_SIZE:101MB}
  task:
    scheduling:
      # 全库 @Scheduled 共用此池。默认 1 会让 17 个定时任务串行，一个调外部接口的慢任务
      # 就能把其余任务全部饿死；调大后互不阻塞（各任务均为 fixedDelay，不会重入）。
      pool:
        size: ${TASK_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: sched-
      shutdown:
        await-termination: true
        await-termination-period: 20s

server:
  forward-headers-strategy: framework

mybatis-plus:
  type-aliases-package: com.crmforlogistics.messagecenter.entity
  type-handlers-package: com.crmforlogistics.messagecenter.typehandler
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework.web.client: INFO
    com.aliyun: ERROR

ai-topic:
  quiet-window-seconds: ${AI_TOPIC_QUIET_WINDOW_SECONDS:360}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
  max-input-records: ${AI_MAX_INPUT_RECORDS:200}
  max-input-bytes: ${AI_MAX_INPUT_BYTES:262144}
  match-threshold: ${AI_TOPIC_MATCH_THRESHOLD:0.65}
  worker-concurrency: ${AI_TOPIC_WORKER_CONCURRENCY:1}
  max-attempts: ${AI_TOPIC_MAX_ATTEMPTS:3}
  lease-seconds: ${AI_TOPIC_LEASE_SECONDS:120}
  poll-interval-seconds: ${AI_TOPIC_POLL_INTERVAL_SECONDS:30}
  audit-max-request-bytes: ${AI_TOPIC_AUDIT_MAX_REQUEST_BYTES:262144}
  audit-max-response-bytes: ${AI_TOPIC_AUDIT_MAX_RESPONSE_BYTES:524288}

# AI 悬浮助手（MCP 工具层）。默认关闭：需要显式 ASSISTANT_ENABLED=true 且凭据齐备，
# 编排服务才会装配；否则 /api/assistant/** 一律 503。
# 凭据刻意复用 AI_BASE_URL / AI_API_KEY / AI_MODEL，但配置项与 ai-topic 分开——换模型时互不影响。
assistant:
  enabled: ${ASSISTANT_ENABLED:false}
  token-encoding: ${ASSISTANT_TOKEN_ENCODING:o200k_base}
  compaction:
    source-batch-size: ${ASSISTANT_CONTEXT_SOURCE_BATCH_SIZE:100}
    minimum-savings-tokens: ${ASSISTANT_CONTEXT_MINIMUM_SAVINGS_TOKENS:64}
    summary-output-tokens: ${ASSISTANT_CONTEXT_SUMMARY_OUTPUT_TOKENS:256}
    max-input-tokens: ${ASSISTANT_CONTEXT_MAX_INPUT_TOKENS:24576}
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  # 单次模型调用的超时。语义是**整个响应读取过程的总时长**，不是「等首字节的时间」：
  # Spring 6.2.6 的 JdkClientHttpRequest 没用 JDK 的 HttpRequest.timeout，而是自己从请求发出起
  # 计时、到点直接关掉响应流（依据见 AssistantModelClient 类注释里的两条实测）。
  # 所以传输层改成流式也规避不了它 —— 要放开长回答只有放大这个窗口。
  # 300 是 AssistantConfig 校验的硬上限（1..300），要再放宽必须先改那里的校验。
  timeout-seconds: ${ASSISTANT_TIMEOUT_SECONDS:300}
  max-message-chars: ${ASSISTANT_MAX_MESSAGE_CHARS:2000}
  max-history-turns: ${ASSISTANT_MAX_HISTORY_TURNS:8}
  max-history-chars: ${ASSISTANT_MAX_HISTORY_CHARS:8000}
  # 待确认动作的有效期。过期后确认返回 410——改期/删除越晚执行越可能落在陈旧假设上。
  pending-ttl-seconds: ${ASSISTANT_PENDING_TTL_SECONDS:600}
  # 一次请求内允许执行的只读工具次数上限。循环只对只读动作开放；写动作一旦出现本轮即结束。
  # 0 = 关闭只读轨（退化为单轮决策，即 L0），是这一档能力的回滚开关。
  # 上限设小是因为多轮收益递减而风险递增：每一轮都是一次新的决策机会，也是新的越狱面。
  max-read-turns: ${ASSISTANT_MAX_READ_TURNS:3}

contact-memory:
  max-inbound-messages: ${CONTACT_MEMORY_MAX_INBOUND_MESSAGES:50}
  max-message-chars: ${CONTACT_MEMORY_MAX_MESSAGE_CHARS:4000}
  max-total-chars: ${CONTACT_MEMORY_MAX_TOTAL_CHARS:50000}
  max-topics: ${CONTACT_MEMORY_MAX_TOPICS:20}
  max-topic-chars: ${CONTACT_MEMORY_MAX_TOPIC_CHARS:1000}
  max-call-transcripts: ${CONTACT_MEMORY_MAX_CALL_TRANSCRIPTS:10}
  max-transcript-chars: ${CONTACT_MEMORY_MAX_TRANSCRIPT_CHARS:4000}
  max-facts: ${CONTACT_MEMORY_MAX_FACTS:100}
  max-labels: ${CONTACT_MEMORY_MAX_LABELS:100}
  max-observations: ${CONTACT_MEMORY_MAX_OBSERVATIONS:100}
  max-observation-chars: ${CONTACT_MEMORY_MAX_OBSERVATION_CHARS:500}
  observation-ttl-days: ${CONTACT_MEMORY_OBSERVATION_TTL_DAYS:30}
  batch-size: ${CONTACT_MEMORY_BATCH_SIZE:50}
  poll-interval-seconds: ${CONTACT_MEMORY_POLL_INTERVAL_SECONDS:600}
  max-attempts: ${CONTACT_MEMORY_MAX_ATTEMPTS:3}
  lease-seconds: ${CONTACT_MEMORY_LEASE_SECONDS:60}
  max-backoff-seconds: ${CONTACT_MEMORY_MAX_BACKOFF_SECONDS:900}
  start-hour: ${CONTACT_MEMORY_START_HOUR:0}
  start-minute: ${CONTACT_MEMORY_START_MINUTE:0}
  time-zone: ${CONTACT_MEMORY_TIME_ZONE:UTC}

app:
  # 统一自适应轮询节拍：空闲时按指数退避拉长到 ceiling-ms，有活立即回基线（AdaptivePollingScheduler）
  polling:
    threads: ${APP_POLLING_THREADS:4}
    ceiling-ms: ${APP_POLLING_CEILING_MS:5000}
  data-dir: ${APP_DATA_DIR:${DATA_DIR:${user.dir}/data}}
  local-dev-mode: ${APP_LOCAL_DEV_MODE:false}
  web-bind-address: ${APP_WEB_BIND_ADDRESS:${WEB_BIND_ADDRESS:127.0.0.1}}
  cust-space-id: ${APP_CUST_SPACE_ID:${CAMS_CUST_SPACE_ID:}}
  chatapp-from: ${APP_CHATAPP_FROM:${CHATAPP_FROM:}}
  chatapp-sync-enabled: ${APP_CHATAPP_SYNC_ENABLED:true}
  aliyun-access-key-id: ${APP_ALIYUN_ACCESS_KEY_ID:${ALIYUN_ACCESS_KEY_ID:}}
  aliyun-access-key-secret: ${APP_ALIYUN_ACCESS_KEY_SECRET:${ALIYUN_ACCESS_KEY_SECRET:}}
  cams-region: ${APP_CAMS_REGION:${CAMS_REGION:ap-southeast-1}}
  cams-endpoint: ${APP_CAMS_ENDPOINT:${CAMS_ENDPOINT:cams.ap-southeast-1.aliyuncs.com}}
  email-sync-enabled: ${APP_EMAIL_SYNC_ENABLED:false}
  smtp-host: ${APP_SMTP_HOST:${SMTP_HOST:smtp.139.com}}
  smtp-port: "${APP_SMTP_PORT:${SMTP_PORT:465}}"
  smtp-user: ${APP_SMTP_USER:${SMTP_USER:}}
  smtp-password: ${APP_SMTP_PASSWORD:${SMTP_PASSWORD:}}
  smtp-ssl: ${APP_SMTP_SSL:true}
  smtp-start-tls: ${APP_SMTP_START_TLS:false}
  smtp-resolve-ipv4: ${APP_SMTP_RESOLVE_IPV4:true}
  mail-from: ${APP_MAIL_FROM:${MAIL_FROM:}}
  mail-from-name: ${APP_MAIL_FROM_NAME:${MAIL_FROM_NAME:}}
  imap-host: ${APP_IMAP_HOST:${IMAP_HOST:imap.139.com}}
  imap-port: "${APP_IMAP_PORT:${IMAP_PORT:993}}"
  imap-user: ${APP_IMAP_USER:${IMAP_USER:}}
  imap-password: ${APP_IMAP_PASSWORD:${IMAP_PASSWORD:}}
  imap-ssl: ${APP_IMAP_SSL:true}
  receive-limit: ${APP_RECEIVE_LIMIT:10}
  mail-provider: ${APP_MAIL_PROVIDER:139}
  imap-139-use-openssl: ${APP_IMAP_139_USE_OPENSSL:true}
  inbox-folder: ${APP_INBOX_FOLDER:INBOX}
  sent-folder: ${APP_SENT_FOLDER:Sent}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://www.blindac.com,https://blindac.com}
  email-attachment-max-count: 16
  email-attachment-max-total-bytes: 20971520
  wecom-enabled: ${WECOM_ENABLED:true}
  wecom-suite-id: ${WECOM_SUITE_ID:}
  wecom-suite-secret: ${WECOM_SUITE_SECRET:}
  wecom-token: ${WECOM_TOKEN:}
  wecom-encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
  wecom-callback-receive-id: ${WECOM_CALLBACK_RECEIVE_ID:}
  # 应用级回调（客户联系事件）：与模板级回调是两条独立通道，凭据也独立。
  # 两个凭据留空时应用级解码器不注册，/api/v1/wecom/app-callback 返回 503。
  wecom-app-token: ${WECOM_APP_TOKEN:}
  wecom-app-encoding-aes-key: ${WECOM_APP_ENCODING_AES_KEY:}
  wecom-contact-event-enabled: ${WECOM_CONTACT_EVENT_ENABLED:false}
  wecom-api-base-url: ${WECOM_API_BASE_URL:https://qyapi.weixin.qq.com}
  wecom-api-timeout-seconds: ${WECOM_API_TIMEOUT_SECONDS:10}
  wecom-token-refresh-skew-seconds: ${WECOM_TOKEN_REFRESH_SKEW_SECONDS:300}

  # 企业微信扫码登录和已有账号绑定（使用已授权代开发安装记录）
  wecom-login-auth-corp-id: ${WECOM_LOGIN_AUTH_CORP_ID:}
  wecom-login-redirect-uri: ${WECOM_LOGIN_REDIRECT_URI:http://localhost:5173/login}
  wecom-allowed-jsapi-origins: ${WECOM_ALLOWED_JSAPI_ORIGINS:}

  # 会话专区同步和官方 OpenDataFrame 展示
  wecom-chatdata-program-id: ${WECOM_CHATDATA_PROGRAM_ID:}
  wecom-chatdata-ability-id: ${WECOM_CHATDATA_ABILITY_ID:conversation_viewer_sync}
  wecom-chatdata-private-key-file: ${WECOM_CHATDATA_PRIVATE_KEY_FILE:}
  wecom-chatdata-public-key-version: ${WECOM_CHATDATA_PUBLIC_KEY_VERSION:1}
  wecom-chatdata-public-key-auto-register: ${WECOM_CHATDATA_PUBLIC_KEY_AUTO_REGISTER:false}
  wecom-chatdata-auto-sync-enabled: ${WECOM_CHATDATA_AUTO_SYNC_ENABLED:true}
  wecom-chatdata-auto-sync-interval-seconds: ${WECOM_CHATDATA_AUTO_SYNC_INTERVAL_SECONDS:60}
  wecom-external-group-sync-poll-interval-seconds: ${WECOM_EXTERNAL_GROUP_SYNC_POLL_INTERVAL_SECONDS:60}

  # 企业微信审计自动保留与分批清理
  wecom-audit-retention-days: ${WECOM_AUDIT_RETENTION_DAYS:7}
  wecom-audit-cleanup-interval-seconds: ${WECOM_AUDIT_CLEANUP_INTERVAL_SECONDS:3600}
  wecom-audit-cleanup-batch-size: ${WECOM_AUDIT_CLEANUP_BATCH_SIZE:500}
  wecom-audit-cleanup-max-batches: ${WECOM_AUDIT_CLEANUP_MAX_BATCHES:32}

  # 官方能力按单条已入库消息提交，默认关闭。
  wecom-message-summary-enabled: ${WECOM_MESSAGE_SUMMARY_ENABLED:false}
  wecom-message-summary-ability-id: ${WECOM_MESSAGE_SUMMARY_ABILITY_ID:conversation_daily_summary}
  wecom-message-summary-poll-interval-seconds: ${WECOM_MESSAGE_SUMMARY_POLL_INTERVAL_SECONDS:1}
  wecom-message-summary-batch-size: ${WECOM_MESSAGE_SUMMARY_BATCH_SIZE:20}
  wecom-message-summary-max-concurrency: ${WECOM_MESSAGE_SUMMARY_MAX_CONCURRENCY:2}
  wecom-message-summary-max-transient-attempts: ${WECOM_MESSAGE_SUMMARY_MAX_TRANSIENT_ATTEMPTS:20}
  wecom-message-summary-max-backoff-seconds: ${WECOM_MESSAGE_SUMMARY_MAX_BACKOFF_SECONDS:900}
  wecom-message-summary-backfill-batch-size: ${WECOM_MESSAGE_SUMMARY_BACKFILL_BATCH_SIZE:200}

  # 非企业微信渠道入站消息的企微应用消息提醒，默认关闭。
  wecom-user-notification-enabled: ${WECOM_USER_NOTIFICATION_ENABLED:false}
  wecom-user-notification-window-ms: ${WECOM_USER_NOTIFICATION_WINDOW_MS:90000}
  wecom-user-notification-worker-interval-ms: ${WECOM_USER_NOTIFICATION_WORKER_INTERVAL_MS:1000}
  wecom-user-notification-max-attempts: ${WECOM_USER_NOTIFICATION_MAX_ATTEMPTS:3}
  wecom-user-notification-retry-backoff-seconds: ${WECOM_USER_NOTIFICATION_RETRY_BACKOFF_SECONDS:10}

  # 待办提醒：当天汇总 + 事项开始前 N 小时，服务端自动调度，前端不再手动触发。
  # 时区必须显式给：due_date/due_time 是"本地日历时间"语义，而 Clock bean 是 UTC。
  todo-reminder-enabled: ${TODO_REMINDER_ENABLED:true}
  todo-reminder-zone: ${TODO_REMINDER_ZONE:Asia/Shanghai}
  todo-reminder-lead-hours: ${TODO_REMINDER_LEAD_HOURS:3}
  todo-reminder-daily-hour: ${TODO_REMINDER_DAILY_HOUR:0}
  todo-reminder-interval-ms: ${TODO_REMINDER_INTERVAL_MS:60000}
  todo-reminder-max-attempts: ${TODO_REMINDER_MAX_ATTEMPTS:5}

  chatapp-outbox-enabled: true
  chatapp-broadcast-worker-enabled: true
  chatapp-broadcast-worker-interval-ms: 1000
  chatapp-webhook-worker-enabled: true
  chatapp-webhook-secret: ${CHATAPP_WEBHOOK_SECRET:}
  chatapp-webhook-max-skew-seconds: 300
  chatapp-api-timeout-seconds: ${CHATAPP_API_TIMEOUT_SECONDS:30}
