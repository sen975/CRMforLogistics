# docker-java 在 api.version 未配置时默认协商 API 1.32（RemoteApiVersion.VERSION_1_32），
# 而 Docker Engine 29+ 已把最低支持版本提到 1.44，低于该版本的请求会直接返回 400，
# 表现为 Testcontainers 报「Could not find a valid Docker environment」。
# 该文件位于测试类路径根目录，是 docker-java 配置链中优先级最低的一层，
# 因此 -Dapi.version=... 与 DOCKER_* 环境变量仍可覆盖它。
api.version=1.44
