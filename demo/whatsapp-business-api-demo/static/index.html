<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhatsApp Business API Demo</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Meta WhatsApp Cloud API</p>
        <h1>WhatsApp 直连测试台</h1>
      </div>
      <div class="status-pill" id="modePill">dry_run</div>
    </header>

    <section class="grid">
      <aside class="panel config-panel">
        <div class="panel-head">
          <h2>Cloud API 配置</h2>
          <button class="icon-button" id="refreshBtn" title="刷新状态" aria-label="刷新状态">↻</button>
        </div>
        <label>运行模式
          <select id="mode">
            <option value="dry_run">dry_run 只生成请求</option>
            <option value="real">real 真实发送</option>
          </select>
        </label>
        <label>Graph Version
          <input id="graphVersion" value="v20.0">
        </label>
        <label>Phone Number ID
          <input id="phoneNumberId" placeholder="Meta 后台的 phone_number_id">
        </label>
        <label>Business Account ID
          <input id="businessAccountId" placeholder="可选，用于后续模板管理">
        </label>
        <label>Access Token
          <input id="accessToken" type="password" placeholder="Meta Cloud API token">
        </label>
        <label>Webhook Verify Token
          <input id="verifyToken" type="password" placeholder="自己设置，Meta 验证 webhook 时填写同一个">
        </label>
        <button class="primary" id="saveConfigBtn">保存配置</button>
        <pre class="mini-log" id="configStatus">等待加载...</pre>
      </aside>

      <section class="panel send-panel">
        <div class="panel-head">
          <h2>发送消息</h2>
          <span class="tag">POST /{phone_number_id}/messages</span>
        </div>
        <div class="two-col">
          <label>收件人 WhatsApp 号
            <input id="to" value="+15551234567">
          </label>
          <label>客户名
            <input id="name" value="Maria Gomez">
          </label>
        </div>
        <label>文本消息
          <textarea id="textBody" rows="4">Hello from direct WhatsApp Business Cloud API.</textarea>
        </label>
        <button class="primary" id="sendTextBtn">发送文本</button>

        <div class="divider"></div>

        <div class="two-col">
          <label>模板名
            <input id="templateName" value="lead_followup">
          </label>
          <label>语言
            <input id="templateLang" value="en_US">
          </label>
        </div>
        <label>Body 参数，用英文逗号分隔
          <input id="templateParams" value="YUEWEI, Shanghai">
        </label>
        <button id="sendTemplateBtn">发送模板</button>

        <div class="divider"></div>

        <div class="two-col">
          <label>媒体类型
            <select id="mediaType">
              <option value="image">image</option>
              <option value="document">document</option>
              <option value="audio">audio</option>
              <option value="video">video</option>
            </select>
          </label>
          <label>Caption
            <input id="caption" value="rate sheet">
          </label>
        </div>
        <label>媒体公网链接
          <input id="mediaLink" value="https://example.com/rate.png">
        </label>
        <button id="sendMediaBtn">发送媒体</button>
      </section>

      <section class="panel webhook-panel">
        <div class="panel-head">
          <h2>Webhook 入站</h2>
          <span class="endpoint">/webhook/whatsapp</span>
        </div>
        <label>模拟 Meta Webhook JSON
          <textarea id="webhookJson" rows="13">{
  "entry": [{
    "changes": [{
      "value": {
        "contacts": [{ "wa_id": "15551234567", "profile": { "name": "Maria" } }],
        "messages": [{
          "id": "wamid.demo.1",
          "from": "15551234567",
          "timestamp": "1783393125",
          "type": "text",
          "text": { "body": "Need quote from Shanghai to Dubai" }
        }],
        "statuses": [{ "id": "wamid.demo.2", "recipient_id": "15551234567", "status": "sent" }]
      }
    }]
  }]
}</textarea>
        </label>
        <button class="primary" id="sendWebhookBtn">模拟入站</button>
      </section>

      <section class="panel activity-panel">
        <div class="panel-head">
          <h2>消息记录</h2>
          <input class="search" id="searchBox" placeholder="搜索内容 / 姓名 / WhatsApp 号">
        </div>
        <div class="list" id="messageList"></div>
      </section>

      <section class="panel event-panel">
        <div class="panel-head">
          <h2>Webhook / 状态</h2>
          <button id="loadEventsBtn">刷新</button>
        </div>
        <div class="list compact" id="eventList"></div>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">
          <h2>请求与响应</h2>
          <button id="clearLogBtn">清空</button>
        </div>
        <pre id="logOutput"></pre>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
