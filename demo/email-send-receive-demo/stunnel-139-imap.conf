# Legacy fallback TLS bridge for China Mobile 139 IMAP.
#
# Prefer the message-center-demo application direct mode instead:
#   MAIL_PROVIDER=139
#   IMAP_HOST=imap.139.com
#   IMAP_PORT=993
#   IMAP_SSL=true
#
# Use this file only if direct JavaMail compatibility fails in your local JDK.
#
# Run:
#   stunnel stunnel-139-imap.conf
#
# Then set:
#   IMAP_HOST=127.0.0.1
#   IMAP_PORT=1993
#   IMAP_SSL=false

foreground = yes
client = yes
debug = info

[imap139]
accept = 127.0.0.1:1993
connect = imap.139.com:993
sni = imap.139.com
sslVersion = TLSv1.2
ciphers = AES256-GCM-SHA384
