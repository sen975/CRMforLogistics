<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>企微会话存档控制台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Official WeCom Archive</p>
          <h1>企业微信会话存档</h1>
        </div>
        <div class="status-strip">
          <span id="config-dot" class="dot"></span>
          <span id="config-text">读取配置中</span>
        </div>
      </header>

      <section class="layout">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-head">
              <h2>连接配置</h2>
              <button id="refresh-status" class="icon-btn" title="刷新配置状态" aria-label="刷新配置状态">⟳</button>
            </div>
            <form id="config-form" class="form-grid">
              <label>CorpID<input name="corp_id" autocomplete="off" /></label>
              <label>Secret<input name="secret" type="password" autocomplete="new-password" placeholder="留空则不覆盖" /></label>
              <label>私钥路径<input name="private_key_path" autocomplete="off" /></label>
              <label>SDK DLL 路径<input name="sdk_lib_path" autocomplete="off" /></label>
              <label>SQLite 路径<input name="db_path" autocomplete="off" /></label>
              <label>媒体目录<input name="media_dir" autocomplete="off" /></label>
              <div class="two-col">
                <label>代理<input name="proxy" autocomplete="off" /></label>
                <label>超时<input name="timeout" type="number" min="1" value="5" /></label>
              </div>
              <label>代理密码<input name="passwd" type="password" autocomplete="new-password" placeholder="留空则不覆盖" /></label>
              <button class="primary" type="submit">保存配置</button>
            </form>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>同步</h2>
            </div>
            <div class="sync-row">
              <label>Limit<input id="sync-limit" type="number" min="1" max="1000" value="1000" /></label>
              <label>Seq<input id="sync-seq" type="number" min="0" placeholder="自动" /></label>
            </div>
            <button id="sync-btn" class="primary block" type="button">同步最新消息</button>
            <div id="sync-result" class="mini-output">等待操作</div>
          </section>
        </aside>

        <section class="content">
          <section class="toolbar panel">
            <div class="filters">
              <label>关键词<input id="filter-keyword" autocomplete="off" /></label>
              <label>发送人<input id="filter-sender" autocomplete="off" /></label>
              <label>群ID<input id="filter-roomid" autocomplete="off" /></label>
              <label>类型
                <select id="filter-msgtype">
                  <option value="">全部</option>
                  <option value="text">文本</option>
                  <option value="image">图片</option>
                  <option value="voice">语音</option>
                  <option value="file">文件</option>
                  <option value="emotion">表情</option>
                  <option value="mixed">混合</option>
                </select>
              </label>
              <label>条数<input id="filter-limit" type="number" min="1" max="1000" value="100" /></label>
            </div>
            <button id="search-btn" class="secondary" type="button">检索</button>
          </section>

          <section class="messages panel">
            <div class="panel-head">
              <h2>消息记录</h2>
              <span id="message-count" class="subtle">0 条</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>时间</th>
                    <th>类型</th>
                    <th>发送人</th>
                    <th>接收/群</th>
                    <th>内容</th>
                    <th>媒体</th>
                  </tr>
                </thead>
                <tbody id="message-body">
                  <tr><td colspan="6" class="empty">暂无数据</td></tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>操作日志</h2>
              <button id="clear-log" class="icon-btn" type="button" title="清空日志" aria-label="清空日志">×</button>
            </div>
            <pre id="log" class="log"></pre>
          </section>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
